[package]
name = "miimic-server"
description = "HTTP server for miimic"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
tracing = "0.1"
schemars = "0.9"
thiserror = "2"
anyhow = "1.0.104"
miimic.workspace = true
serde = { version = "1", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = { version = "0.15.7", features = ["clap"] }
tower-http = { version = "0.6", features = ["trace"] }
axum-jsonschema = { version = "0.9.1", features = ["aide"] }
aide = { version = "0.15.1", features = ["axum", "axum-query", "scalar"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }

[build-dependencies]
chrono = "0.4.45"

[lints]
workspace = true
